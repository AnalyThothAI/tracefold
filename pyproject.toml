[project]
name = "tracefold"
version = "0.1.0"
description = "Tracefold Market Research System: evidence-first market research with PostgreSQL-backed facts, signals, agent audit, and outcome attribution."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.0",
    # #344 owns one exact native-DSPy execution envelope. GEPA is consumed only through `dspy.GEPA`, so its
    # compatible version is DSPy's transitive responsibility rather than a second direct project contract.
    "dspy==3.3.1",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "loguru>=0.7.2",
    "nautilus_trader==1.231.0",
    "prometheus-client>=0.22.0",
    "psycopg[binary,pool]>=3.2.0",
    "pydantic>=2.8.0",
    "regex==2026.5.9",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "aio-pika>=9.5,<10",
]

[dependency-groups]
dev = [
    # Exactly pinned (#373): coverage's measured numbers are only comparable across exact-main runs
    # if the measuring tool cannot move underneath them. 7.16 is also the floor for the official
    # `[run] patch = ["subprocess"]` support the child-process lanes depend on.
    "coverage[toml]==7.16.0",
    "defusedxml>=0.7.1",
    "hypothesis==6.165.10",
    "pytest>=8.3.0",
    "ruff>=0.8.6",
    "pre-commit>=3.7",
    "mypy==1.17.1",
    "testcontainers[postgres]>=4.8",
    "types-defusedxml>=0.7.0",
    "types-regex>=2024.11.6",
]
# The scheduled mutation lane (#373). Not a default group, for the reason `research` is not one:
# `uv run`, `make test` and the Docker image (`uv sync --locked --no-dev`) never install it, so a
# harness whose whole job is to rewrite source in place cannot reach a service image or a release
# path. `uv sync --group mutation` is the one way in.
#
# Exactly pinned, like `coverage`, and for the same reason one step further: the tool's operator set
# *is* the mutant population. A new Cosmic Ray minor that adds or retires an operator changes the
# denominator of every score and the contents of `mutation-survivors.toml`, without a line of
# `tracefold` having changed.
mutation = [
    "cosmic-ray==8.7.0",
]

# The `notebooks/` research workspace (#274). Not a default group: `uv run`, `make test` and the
# Docker image never install it, so a Jupyter stack cannot reach a worker, a release path, or the
# service dependency set. `uv sync --group research` is the one way in.
research = [
    "ipykernel>=6.29",
    "jupyterlab>=4.6",
    "matplotlib>=3.10",
    "nbclient>=0.10",
    "nbconvert>=7.16",
    "pandas>=2.2",
]

[project.scripts]
tracefold = "tracefold.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tracefold"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
empty_parameter_set_mark = "fail_at_collect"
xfail_strict = true
markers = [
  "integration: requires PostgreSQL, RabbitMQ, or an HTTP/worker integration resource",
  "deploy: deploy/operations subprocess, process, signal, or executable simulation",
  "e2e: cross-process; needs testcontainers + uvicorn subprocess (lives in tests/e2e/)",
  "architecture: hermetic semantic package/dependency/ownership invariants",
  "contract: front-back schema/contract drift checks (lives in tests/contract/)",
  "external_codegen: release-only code generation requiring Node dependencies",
  "golden: deterministic corpus checks against real Postgres (lives in tests/golden/)",
  "live: opt-in tests that call external provider APIs",
  "migration: historical PostgreSQL upgrade and downgrade contracts against an empty database",
  "scheduled: opt-in production-duration diagnostics excluded from merge evidence",
  "slow: deterministic process/meta tests using shortened injected deadlines (excluded from make test)",
  "property: bounded Hypothesis properties over pure state and typed boundaries",
  "package: builds and installs the real distribution; needs uv and its dependency cache",
]

# Coverage is a gap signal, not a quality target (#373). It is produced by the same single execution
# of the fixed required tests — `coverage run --parallel-mode -m pytest` — so no suite runs twice and
# the numbers describe exactly the run that produced the JUnit report beside them. Nothing here
# adjudicates pass/fail; the test frameworks and job exit codes remain the only execution truth.
[tool.coverage.run]
branch = true
parallel = true
relative_files = true
source = ["tracefold"]
# coverage.py's own subprocess support, not a project import hook: `patch` exports the config to
# children, and coverage's wheel installs the `.pth` that starts them measuring. This is what puts
# the Workers root, the uvicorn process and the CLI children of the process lanes in the data.
patch = ["subprocess"]
data_file = "artifacts/coverage/.coverage"

# Nothing is excluded. The allowance was for generated artifacts and Alembic revision boilerplate:
# there is no generated Python under `tracefold/`, and the revision tree lives under
# `tracefold/platform/`, outside both domains whose numbers are read. Excluding News or Trading
# orchestration, error branches, storage or adapters would defeat the signal, so none of it is.
[tool.coverage.report]
precision = 1
show_missing = false
skip_covered = false

[tool.coverage.paths]
source = ["tracefold", "*/tracefold"]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["notebooks/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "ASYNC", "RUF", "PERF", "PL"]
# Common pragmatic ignores. Each ignore is a deliberate choice:
# - PLR0913: too many args is sometimes correct for adapters/factories
# - PLR2004: magic numbers in tests are normal (also blocked by per-file-ignores)
# - PLR0911/PLR0912/PLR0915: cyclomatic complexity caps too low for a few orchestration funcs
# - S105/S106: "possible password" fires on version strings, filename defaults, redaction
#         strings ("password_file", "token_resolution_status");
#         no actual credentials are hardcoded in the src/ tree.
# - RUF001: codebase has intentional Chinese fullwidth characters in constant/model strings
#         (e.g. Chinese punctuation in user-visible prompts); not copy-paste accidents.
# - PLC0415: deferred imports in src/ are intentional where they break circular dependencies
#         or defer optional runtime dependencies. ruff --fix strips noqa comments on these so
#         they're globally ignored.
ignore = [
  "PLR0913",
  "PLR2004",
  "PLR0911",
  "PLR0912",
  "PLR0915",
  "S105",
  "S106",
  "RUF001",
  "PLC0415",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",   # asserts are the test contract
  "S311",   # pseudo-random in tests is fine
  "PLR2004",
  "ASYNC",
  "PLC0415",  # deferred imports in test helpers/parametrized fixtures are intentional
  "S603",   # subprocess in integration tests always calls well-known CLI tools
  "S607",   # subprocess calls in integration tests use well-known CLI tools (make, git, uv)
  "S608",   # test-only fixed DDL/fixture fragments; production SQL remains checked
]
"scripts/**" = [
  "S603",   # subprocess inputs are local CLI args
  "S607",
]
# The research workspace's own self-tests (#537 PR-1). They are not in `tests/`, so `testpaths` never
# collects them and CI never runs them — but they are still tests, and `assert` is still their contract.
"notebooks/research/test_*.py" = [
  "S101",
  "PLR2004",
]
[tool.ruff.format]
# Default settings; line-length inherited from [tool.ruff] = 120

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
namespace_packages = true
explicit_package_bases = true
plugins = ["pydantic.mypy"]

# `tracefold.app` is the cross-capability composition seam: what it hands News and Trading has to be
# the shape they declared. Issue #162 PR7-B4 restored `warn_return_any`, `assignment`, `union-attr` and
# `arg-type` here, which is what makes the typed runtime ports and the News -> Trading mapper real
# rather than decorative. The remainder is untyped-provider debt and may only shrink.
[[tool.mypy.overrides]]
module = "tracefold.app.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
disallow_any_generics = false
disallow_subclassing_any = false
disable_error_code = ["index", "operator", "no-untyped-call"]

[[tool.mypy.overrides]]
module = "tracefold.integrations.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
disallow_any_generics = false
disallow_subclassing_any = false
warn_return_any = false
disable_error_code = ["arg-type", "attr-defined", "union-attr", "index", "operator", "assignment", "no-untyped-call"]

[[tool.mypy.overrides]]
module = ["alembic.*", "loguru.*", "psycopg.*", "curl_cffi.*", "websockets.*", "litellm.*", "nautilus_trader.*", "solders.*", "eth_hash.*", "eth_utils.*", "testcontainers.*", "yaml"]
ignore_missing_imports = true

[tool.uv.sources]
