# The scheduled mutation batch. `make mutation` runs it; `.github/workflows/mutation.yml` schedules it.
#
# 433-C removes the execution-quote and Capital kernels. The remaining load-bearing pure price
# kernel turns source-native bars into the basis-point move frozen on a Case. Mutation testing is
# useful here because ordinary coverage cannot show that the exact arithmetic bounds are asserted.
#
# Nothing is excluded. Annotation-only `|` survivors are classified after the fact by
# `mutation-survivors.toml`, whose premise is checked per source site. `--no-sync` freezes the
# environment while Cosmic Ray temporarily rewrites the tracked module in place.

[cosmic-ray]
module-path = [
  "tracefold/trading/market_context.py",
]
timeout = 60.0
excluded-modules = []
test-command = "uv run --no-sync python -m pytest -x -q -p no:cacheprovider tests/trading/test_market_context.py"

[cosmic-ray.distributor]
name = "local"
