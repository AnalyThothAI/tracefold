# Tracefold
ws_token: "replace-with-a-strong-token"

api:
  host: "0.0.0.0"
  port: 8765
  heartbeat_interval: 30
  replay_limit: 100

storage:
  postgres:
    dsn: "postgresql://tracefold_app@postgres:5432/tracefold"
    password_file: "postgres_password"
    pool_min_size: 1
    pool_max_size: 16
    connect_timeout_seconds: 5

llm:
  api_key:
  base_url: ""
  openrouter_api_key:
  groq_api_key:

gmgn:
  api_key:
  openapi_base_url: "https://openapi.gmgn.ai"
  timeout_seconds: 5
  token_info_cache_ttl_seconds: 60

providers:
  okx:
    dex_base_url: "https://web3.okx.com"
    dex_chain_indexes: ["501", "1", "56", "8453", "607"]
    dex_ws_url: "wss://wsdex.okx.com/ws/v6/dex"
    dex_api_key:
    dex_secret_key:
    dex_passphrase:
    timeout_seconds: 15
  binance:
    enabled: true
    web3_base_url: "https://web3.binance.com"
    cex_profile_base_url: "https://www.binance.com"
    usdm_futures_base_url: "https://fapi.binance.com"
    cex_universe_quote_symbol: "USDT"
    cex_universe_contract_type: "PERPETUAL"
    timeout_seconds: 15
  macro_sources:
    enabled: true
    fred_enabled: true
    cboe_enabled: true
    cftc_enabled: true
    nasdaq_public_enabled: true
    request_timeout_seconds: 60
    user_agent: "TracefoldMacro/1.0 research@localhost"

news:
  enabled: true
  # The source catalog is code-owned; `sources` is not a configuration field.
  # The pinned WorldMonitor full/en inventory plus Tracefold's crypto feeds
  # and 6551NEWS extension are always used. RSSHub is internal to compose;
  # 6551NEWS resolves through
  # http://rsshub:1200/telegram/channel/news6551.
  # Worker timing and provider endpoints/models live in workers.yaml.
  relay:
    # WorldMonitor-compatible independent egress fallback. Direct fetch is
    # always attempted first; only enabled code-owned source URLs are relayed.
    base_url: "https://proxy.worldmonitor.app"
    auth_header: "x-relay-key"
    auth_token:

upstream:
  chains: ["sol", "eth", "base", "bsc"]
  channels: ["twitter_monitor_basic", "twitter_monitor_token"]
  app_version: "20260429-12894-ccec416"
  proxy:
  reconnect_delay: 3
  heartbeat_interval: 25
  idle_timeout: 90
