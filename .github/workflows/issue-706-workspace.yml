name: Issue 706 verified workspace import

on:
  push:
    branches: [codex/issue-706-event-updates]
    paths: [.github/workflows/issue-706-workspace.yml]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply the locally verified issue 706 patch
        env:
          EXPECTED_BRANCH: codex/issue-706-event-updates
        run: |
          python - <<'PY'
          import base64, hashlib, lzma, os, pathlib, subprocess
          assert os.environ['GITHUB_REF'] == 'refs/heads/' + os.environ['EXPECTED_BRANCH']
          before = subprocess.check_output(['git', 'diff', '--name-only', '1500112328cdbf7c5b501cde853b91e2c5c586c6', 'HEAD'], text=True).splitlines()
          assert before == ['.github/workflows/issue-706-workspace.yml'], before
          encoded = '''
          
          
          '''
          patch = lzma.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == '3747a945d34b030a4acb92ad82babf66e021a9f8265e86d4d92618e4dbf3d55b'
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'issue-706.patch'
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', str(path)], check=True)
          PY
          git add tracefold/news tests/news
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(news): add verified event update and bounded judgment foundations for #706'
          git push origin HEAD:refs/heads/codex/issue-706-event-updates
