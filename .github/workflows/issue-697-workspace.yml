name: Issue 697 isolated workspace

on:
  push:
    branches: [fix/697-wallet-minimal-loop]
    paths: [.github/workflows/issue-697-workspace.yml]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 4272509842ab3cc5d69bd6e29632bcbda4c7d225
      - name: Archive tracked source only
        run: git archive --format=tar HEAD | gzip > /tmp/tracefold-697-source.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tracefold-697-source
          path: /tmp/tracefold-697-source.tar.gz
          retention-days: 1
          if-no-files-found: error
