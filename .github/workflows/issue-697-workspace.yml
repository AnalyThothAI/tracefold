name: Issue 697 isolated workspace

on:
  push:
    branches: [fix/697-wallet-minimal-loop]
    paths: [.github/workflows/issue-697-workspace.yml]

permissions:
  contents: write

jobs:
  apply-verified-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Verify and apply the locally tested wallet change
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cat .github/issue-697-workspace/patch.* > /tmp/wallet-697.patch.xz
          echo '9e789773ae2d0c5e2587c83b6a08d740279f03a4d47bfb70ee8958774e97e58c  /tmp/wallet-697.patch.xz' | sha256sum -c -
          xz -dc /tmp/wallet-697.patch.xz > /tmp/wallet-697.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit 5df9aff4c5310c180f4951868107ef0a9147ac59
          git apply --check --unidiff-zero /tmp/wallet-697.patch
          git apply --index --unidiff-zero /tmp/wallet-697.patch
          git diff --cached --check
          git commit -m 'fix(wallet): full source membership and continuous complete prefix (#697)'
          git push origin HEAD:fix/697-wallet-minimal-loop
          echo "Applied commit: $(git rev-parse HEAD)"
          echo "Applied tree: $(git rev-parse HEAD^{tree})"
