name: PR 711 source snapshot

# Temporary read-only source handoff for the existing PR's implementation work.
# No environment secrets, installation, deployment, model or venue calls.
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/pr711-source-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    if: github.event.pull_request.number == 711
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Archive tracked public source only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          mkdir -p "$RUNNER_TEMP/pr711-source"
          git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/pr711-source/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/pr711-source/commit.txt"
          sha256sum "$RUNNER_TEMP/pr711-source/source.tar.gz" > "$RUNNER_TEMP/pr711-source/sha256.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr711-source-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/pr711-source
          retention-days: 1
          if-no-files-found: error
