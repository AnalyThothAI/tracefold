name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published, prereleased]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"
  UV_VERSION: "0.11.7"
  TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  quality-static:
    name: quality-static
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0, persist-credentials: false, ref: "${{ env.TESTED_SHA }}"}
      - name: Require the exact tested SHA
        run: test "$(git rev-parse HEAD)" = "$TESTED_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "${{ env.PYTHON_VERSION }}"}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with: {version: "${{ env.UV_VERSION }}", enable-cache: true, cache-dependency-glob: uv.lock}
      - run: uv sync --locked
      - name: Run static quality and contract tests
        run: make ci-quality-static
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-results-quality-static-${{ env.TESTED_SHA }}
          path: artifacts/test-results
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-quality-static-${{ env.TESTED_SHA }}
          path: artifacts/coverage
          include-hidden-files: true
          if-no-files-found: warn

  python-hermetic:
    name: python-hermetic
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0, persist-credentials: false, ref: "${{ env.TESTED_SHA }}"}
      - name: Require the exact tested SHA
        run: test "$(git rev-parse HEAD)" = "$TESTED_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "${{ env.PYTHON_VERSION }}"}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with: {version: "${{ env.UV_VERSION }}", enable-cache: true, cache-dependency-glob: uv.lock}
      - run: uv sync --locked
      - name: Run hermetic Python tests
        run: make ci-python-hermetic
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-results-python-hermetic-${{ env.TESTED_SHA }}
          path: artifacts/test-results
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-python-hermetic-${{ env.TESTED_SHA }}
          path: artifacts/coverage
          include-hidden-files: true
          if-no-files-found: warn

  postgres-behavior:
    name: postgres-behavior
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres: &postgres_service
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env: {POSTGRES_DB: tracefold_test, POSTGRES_PASSWORD: postgres, POSTGRES_USER: postgres}
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d tracefold_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      rabbitmq: &rabbitmq_service
        # 4.3 is required, not preferred: quorum delayed retry, broker-owned delivery counting and
        # at-least-once dead lettering replaced Tracefold's own retry lane (#400).
        image: rabbitmq:4.3.5-management-alpine@sha256:e2f08f846de10bb09649a8b020f286ed362a8f72ee45e5a8d043851f1533fda8
        env: {RABBITMQ_DEFAULT_PASS: tracefold, RABBITMQ_DEFAULT_USER: tracefold}
        ports: ["5672:5672", "15672:15672"]
        # The probe runs as `rabbitmq`: a root-run CLI that reaches /var/lib/rabbitmq before the node has
        # written .erlang.cookie creates it root-owned and 0400, and 4.3.5 then refuses to boot.
        options: >-
          --health-cmd "su -s /bin/sh rabbitmq -c 'PATH=/opt/rabbitmq/sbin:/opt/erlang/bin:/usr/local/bin:/usr/bin:/bin rabbitmq-diagnostics -q ping'"
          --health-interval 5s --health-timeout 10s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0, persist-credentials: false, ref: "${{ env.TESTED_SHA }}"}
      - name: Require the exact tested SHA
        run: test "$(git rev-parse HEAD)" = "$TESTED_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "${{ env.PYTHON_VERSION }}"}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with: {version: "${{ env.UV_VERSION }}", enable-cache: true, cache-dependency-glob: uv.lock}
      - run: uv sync --locked
      - name: Run PostgreSQL and broker behavior tests
        env: &resource_env
          TRACEFOLD_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:55432/tracefold_test
          TRACEFOLD_TEST_AMQP_URL: amqp://tracefold:tracefold@127.0.0.1:5672/
          TRACEFOLD_TEST_RABBITMQ_MANAGEMENT_URL: http://127.0.0.1:15672
        run: make ci-postgres-behavior
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-results-postgres-behavior-${{ env.TESTED_SHA }}
          path: artifacts/test-results
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-postgres-behavior-${{ env.TESTED_SHA }}
          path: artifacts/coverage
          include-hidden-files: true
          if-no-files-found: warn

  migration:
    name: migration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres: *postgres_service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0, persist-credentials: false, ref: "${{ env.TESTED_SHA }}"}
      - name: Require the exact tested SHA
        run: test "$(git rev-parse HEAD)" = "$TESTED_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "${{ env.PYTHON_VERSION }}"}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with: {version: "${{ env.UV_VERSION }}", enable-cache: true, cache-dependency-glob: uv.lock}
      - run: uv sync --locked
      - name: Run every historical migration test
        env:
          TRACEFOLD_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:55432/tracefold_test
        run: make ci-migration
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-results-migration-${{ env.TESTED_SHA }}
          path: artifacts/test-results
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-migration-${{ env.TESTED_SHA }}
          path: artifacts/coverage
          include-hidden-files: true
          if-no-files-found: warn

  runtime-process:
    name: runtime-process
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres: *postgres_service
      rabbitmq: *rabbitmq_service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0, persist-credentials: false, ref: "${{ env.TESTED_SHA }}"}
      - name: Require the exact tested SHA
        run: test "$(git rev-parse HEAD)" = "$TESTED_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "${{ env.PYTHON_VERSION }}"}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: web/package-lock.json}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with: {version: "${{ env.UV_VERSION }}", enable-cache: true, cache-dependency-glob: uv.lock}
      - run: uv sync --locked
      - run: npm ci --prefix web
      - name: Name the disposable broker
        # #400 proves process, channel and broker restart on one persisted node. A test never picks a
        # broker to restart on its own — the local default is the operator's own deployment — so the
        # service container is named here, and a missing one fails the job rather than skipping a test.
        run: |
          set -euo pipefail
          container=$(docker ps --filter "label=com.docker.compose.service" --format '{{.Names}} {{.Image}}' \
            | awk '$2 ~ /rabbitmq/ {print $1; exit}')
          if [ -z "$container" ]; then
            container=$(docker ps --format '{{.Names}} {{.Image}}' | awk '$2 ~ /rabbitmq/ {print $1; exit}')
          fi
          test -n "$container"
          echo "TRACEFOLD_TEST_RABBITMQ_CONTAINER=$container" >> "$GITHUB_ENV"
      - name: Run process, deployment, E2E, golden, and slow tests
        env: *resource_env
        run: make ci-runtime-process
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-results-runtime-process-${{ env.TESTED_SHA }}
          path: artifacts/test-results
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-runtime-process-${{ env.TESTED_SHA }}
          path: artifacts/coverage
          include-hidden-files: true
          if-no-files-found: warn

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres: *postgres_service
      rabbitmq: *rabbitmq_service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0, persist-credentials: false, ref: "${{ env.TESTED_SHA }}"}
      - name: Require the exact tested SHA
        run: test "$(git rev-parse HEAD)" = "$TESTED_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "${{ env.PYTHON_VERSION }}"}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: web/package-lock.json}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with: {version: "${{ env.UV_VERSION }}", enable-cache: true, cache-dependency-glob: uv.lock}
      - name: Install locked dependencies
        run: |
          uv sync --locked
          npm ci --prefix web
          (cd web && npx playwright install --with-deps chromium)
      - name: Run frontend, generated-contract, and browser tests
        env: *resource_env
        run: make ci-frontend
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-results-frontend-${{ env.TESTED_SHA }}
          path: artifacts/test-results
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-frontend-${{ env.TESTED_SHA }}
          path: artifacts/coverage
          include-hidden-files: true
          if-no-files-found: warn

  # Report-only (#373 PR 2). It combines the coverage data the fixed jobs already produced and prints
  # standard coverage.py reports. It reads no JUnit, Vitest, or Playwright report, and re-runs no test.
  #
  # Absence from `ci-gate`'s dependencies is only half of "report-only", and the missing half is the
  # one that bites. `scripts/require_main_ci.py` requires the whole *workflow run* to have concluded
  # `success`, not merely `ci-gate` — so a failure in any job of this workflow, required or not,
  # would raise `main_ci_gate_not_full_plan` and refuse to deploy an otherwise green main.
  # `continue-on-error` keeps a coverage failure out of the run's conclusion, which is what actually
  # makes this job unable to decide anything.
  test-effectiveness:
    name: test-effectiveness
    needs: [quality-static, python-hermetic, postgres-behavior, migration, runtime-process, frontend]
    if: always()
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, ref: "${{ env.TESTED_SHA }}"}
      - name: Require the exact tested SHA
        run: test "$(git rev-parse HEAD)" = "$TESTED_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "${{ env.PYTHON_VERSION }}"}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with: {version: "${{ env.UV_VERSION }}", enable-cache: true, cache-dependency-glob: uv.lock}
      - run: uv sync --locked
      - name: Collect the coverage every fixed job produced
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: coverage-*-${{ env.TESTED_SHA }}
          path: artifacts/coverage
          merge-multiple: true
      - name: Combine and report
        run: make ci-test-effectiveness
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-report-${{ env.TESTED_SHA }}
          path: artifacts/coverage
          include-hidden-files: true
          if-no-files-found: warn

  ci-gate:
    name: ci-gate
    needs: [quality-static, python-hermetic, postgres-behavior, migration, runtime-process, frontend]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      QUALITY_STATIC_RESULT: ${{ needs.quality-static.result }}
      PYTHON_HERMETIC_RESULT: ${{ needs.python-hermetic.result }}
      POSTGRES_BEHAVIOR_RESULT: ${{ needs.postgres-behavior.result }}
      MIGRATION_RESULT: ${{ needs.migration.result }}
      RUNTIME_PROCESS_RESULT: ${{ needs.runtime-process.result }}
      FRONTEND_RESULT: ${{ needs.frontend.result }}
    steps:
      - name: Require every fixed job to succeed
        run: |
          for result in \
            "$QUALITY_STATIC_RESULT" \
            "$PYTHON_HERMETIC_RESULT" \
            "$POSTGRES_BEHAVIOR_RESULT" \
            "$MIGRATION_RESULT" \
            "$RUNTIME_PROCESS_RESULT" \
            "$FRONTEND_RESULT"
          do
            if [ "$result" != success ]; then
              echo "required CI job did not succeed: $result" >&2
              exit 1
            fi
          done
