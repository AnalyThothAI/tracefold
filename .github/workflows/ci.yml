name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published, prereleased]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"
  UV_VERSION: "0.11.7"
  TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  quality-static:
    name: quality-static
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0, persist-credentials: false, ref: "${{ env.TESTED_SHA }}"}
      - name: Require the exact tested SHA
        run: test "$(git rev-parse HEAD)" = "$TESTED_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "${{ env.PYTHON_VERSION }}"}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with: {version: "${{ env.UV_VERSION }}", enable-cache: true, cache-dependency-glob: uv.lock}
      - run: uv sync --locked
      - name: Run static quality and contract tests
        run: make ci-quality-static
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-results-quality-static-${{ env.TESTED_SHA }}
          path: artifacts/test-results
          if-no-files-found: error

  python-hermetic:
    name: python-hermetic
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0, persist-credentials: false, ref: "${{ env.TESTED_SHA }}"}
      - name: Require the exact tested SHA
        run: test "$(git rev-parse HEAD)" = "$TESTED_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "${{ env.PYTHON_VERSION }}"}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with: {version: "${{ env.UV_VERSION }}", enable-cache: true, cache-dependency-glob: uv.lock}
      - run: uv sync --locked
      - name: Run hermetic Python tests
        run: make ci-python-hermetic
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-results-python-hermetic-${{ env.TESTED_SHA }}
          path: artifacts/test-results
          if-no-files-found: error

  postgres-behavior:
    name: postgres-behavior
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres: &postgres_service
        image: postgres:18-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
        env: {POSTGRES_DB: tracefold_test, POSTGRES_PASSWORD: postgres, POSTGRES_USER: postgres}
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d tracefold_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      rabbitmq: &rabbitmq_service
        # 4.3 is required, not preferred: quorum delayed retry, broker-owned delivery counting and
        # at-least-once dead lettering replaced Tracefold's own retry lane (#400).
        image: rabbitmq:4.3.5-management-alpine@sha256:e2f08f846de10bb09649a8b020f286ed362a8f72ee45e5a8d043851f1533fda8
        env: {RABBITMQ_DEFAULT_PASS: tracefold, RABBITMQ_DEFAULT_USER: tracefold}
        ports: ["5672:5672", "15672:15672"]
        # The probe runs as `rabbitmq`: a root-run CLI that reaches /var/lib/rabbitmq before the node has
        # written .erlang.cookie creates it root-owned and 0400, and 4.3.5 then refuses to boot.
        options: >-
          --health-cmd "su -s /bin/sh rabbitmq -c 'PATH=/opt/rabbitmq/sbin:/opt/erlang/bin:/usr/local/bin:/usr/bin:/bin rabbitmq-diagnostics -q ping'"
          --health-interval 5s --health-timeout 10s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0, persist-credentials: false, ref: "${{ env.TESTED_SHA }}"}
      - name: Require the exact tested SHA
        run: test "$(git rev-parse HEAD)" = "$TESTED_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "${{ env.PYTHON_VERSION }}"}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with: {version: "${{ env.UV_VERSION }}", enable-cache: true, cache-dependency-glob: uv.lock}
      - run: uv sync --locked
      # Two pytest selections and the generated-schema check, one PostgreSQL. The historical
      # migration walk was a job of its own until #598 D8; it needs exactly this pinned image.
      - name: Run PostgreSQL behavior, migration, and generated-schema checks
        env: &resource_env
          TRACEFOLD_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:55432/tracefold_test
          TRACEFOLD_POSTGRES_IMAGE: postgres:18-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
          TRACEFOLD_TEST_AMQP_URL: amqp://tracefold:tracefold@127.0.0.1:5672/
          TRACEFOLD_TEST_RABBITMQ_MANAGEMENT_URL: http://127.0.0.1:15672
        run: make ci-postgres-behavior
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-results-postgres-behavior-${{ env.TESTED_SHA }}
          path: artifacts/test-results
          if-no-files-found: error

  runtime-broker:
    name: runtime-broker
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres: *postgres_service
      rabbitmq: *rabbitmq_service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0, persist-credentials: false, ref: "${{ env.TESTED_SHA }}"}
      - name: Require the exact tested SHA
        run: test "$(git rev-parse HEAD)" = "$TESTED_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "${{ env.PYTHON_VERSION }}"}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with: {version: "${{ env.UV_VERSION }}", enable-cache: true, cache-dependency-glob: uv.lock}
      - run: uv sync --locked
      - name: Name the disposable broker
        # #400 proves process, channel and broker restart on one persisted node. A test never picks a
        # broker to restart on its own — the local default is the operator's own deployment — so the
        # service container is named here, and a missing one fails the job rather than skipping a test.
        run: |
          set -euo pipefail
          container=$(docker ps --filter "label=com.docker.compose.service" --format '{{.Names}} {{.Image}}' \
            | awk '$2 ~ /rabbitmq/ {print $1; exit}')
          if [ -z "$container" ]; then
            container=$(docker ps --format '{{.Names}} {{.Image}}' | awk '$2 ~ /rabbitmq/ {print $1; exit}')
          fi
          test -n "$container"
          echo "TRACEFOLD_TEST_RABBITMQ_CONTAINER=$container" >> "$GITHUB_ENV"
      - name: Run broker, process, and golden tests
        env: *resource_env
        run: make ci-runtime-broker
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-results-runtime-broker-${{ env.TESTED_SHA }}
          path: artifacts/test-results
          if-no-files-found: error

  deploy-e2e:
    name: deploy-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres: *postgres_service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0, persist-credentials: false, ref: "${{ env.TESTED_SHA }}"}
      - name: Require the exact tested SHA
        run: test "$(git rev-parse HEAD)" = "$TESTED_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "${{ env.PYTHON_VERSION }}"}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: web/package-lock.json}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with: {version: "${{ env.UV_VERSION }}", enable-cache: true, cache-dependency-glob: uv.lock}
      - name: Install locked dependencies
        run: |
          uv sync --locked
          npm ci --prefix web
      - name: Run deploy, E2E, and capacity tests
        env:
          TRACEFOLD_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:55432/tracefold_test
          TRACEFOLD_POSTGRES_IMAGE: postgres:18-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
        run: make ci-deploy-e2e
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-results-deploy-e2e-${{ env.TESTED_SHA }}
          path: artifacts/test-results
          if-no-files-found: error

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres: *postgres_service
      rabbitmq: *rabbitmq_service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0, persist-credentials: false, ref: "${{ env.TESTED_SHA }}"}
      - name: Require the exact tested SHA
        run: test "$(git rev-parse HEAD)" = "$TESTED_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "${{ env.PYTHON_VERSION }}"}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: web/package-lock.json}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with: {version: "${{ env.UV_VERSION }}", enable-cache: true, cache-dependency-glob: uv.lock}
      - name: Install locked dependencies
        run: |
          uv sync --locked
          npm ci --prefix web
          (cd web && npx playwright install --with-deps chromium)
      # Every Node-dependent selection (#598 D8): the generated-contract codegen, the required-test
      # and hook fail-closed nodeids that used to be the `test-integrity` job, the two Vitest
      # projects, the four-viewport golden-path interaction specs, and the full-stack smoke.
      - name: Run frontend, generated-contract, test-integrity, and browser tests
        env: *resource_env
        run: make ci-frontend
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-results-frontend-${{ env.TESTED_SHA }}
          path: artifacts/test-results
          if-no-files-found: error

  ci-gate:
    name: ci-gate
    needs: [quality-static, python-hermetic, postgres-behavior, runtime-broker, deploy-e2e, frontend]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      QUALITY_STATIC_RESULT: ${{ needs.quality-static.result }}
      PYTHON_HERMETIC_RESULT: ${{ needs.python-hermetic.result }}
      POSTGRES_BEHAVIOR_RESULT: ${{ needs.postgres-behavior.result }}
      RUNTIME_BROKER_RESULT: ${{ needs.runtime-broker.result }}
      DEPLOY_E2E_RESULT: ${{ needs.deploy-e2e.result }}
      FRONTEND_RESULT: ${{ needs.frontend.result }}
    steps:
      - name: Require every fixed job to succeed
        run: |
          for result in \
            "$QUALITY_STATIC_RESULT" \
            "$PYTHON_HERMETIC_RESULT" \
            "$POSTGRES_BEHAVIOR_RESULT" \
            "$RUNTIME_BROKER_RESULT" \
            "$DEPLOY_E2E_RESULT" \
            "$FRONTEND_RESULT"
          do
            if [ "$result" != success ]; then
              echo "required CI job did not succeed: $result" >&2
              exit 1
            fi
          done
