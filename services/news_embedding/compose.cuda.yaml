# Explicit CUDA deployment after the calibrated runtime has been selected and tested.
services:
  news-embedding:
    build:
      args:
        TORCH_VERSION: 2.11.0+cu128
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu128
    environment:
      EMBEDDING_DEVICE: cuda:0
      # WSL supports an all-device reservation; Torch sees only physical GPU 1.
      CUDA_VISIBLE_DEVICES: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
