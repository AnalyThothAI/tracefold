[alembic]
; `%(here)s` is the directory holding this file. Alembic resolves a bare relative
; `script_location` against the *current working directory*, so before #373 fixed this the
; revision tree was only findable when a caller happened to run from the repository root --
; which `migrations.py` already goes out of its way not to assume, resolving `alembic.ini`
; absolutely from its own `__file__`.
script_location = %(here)s/tracefold/platform/postgres/alembic
prepend_sys_path = %(here)s
path_separator = os
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
