# Every mutant that survives the batch in `mutation.toml`, and why it is allowed to.
#
# `scripts/mutation_survivors.py` fails the lane on a survivor that is not covered here, on an entry
# that no longer matches a survivor, and on a rule that matches none. The second and third matter as
# much as the first: an exemption that outlives its reason is how a gate stops gating while still
# looking like one.
#
# A survivor is only ever one of two things. Either a test should have caught it and does not, in
# which case the fix is a test and not an entry here; or it cannot change observable behaviour, in
# which case the reason belongs in writing where someone can disagree with it. Nothing is listed
# here because it was inconvenient to kill.

# ---------------------------------------------------------------------------------------------
# Rules: mechanical categories, accepted only where the premise is checked against the source.
# ---------------------------------------------------------------------------------------------

[[rule]]
kind = "annotation-union"
operator = "core/ReplaceBinaryOperator_BitOr_.*"
reason = """
A `|` inside a type annotation, in a module with `from __future__ import annotations`. The
annotation is stored as a string and never evaluated, so replacing the union operator with `+`,
`&`, `/` or `>>` cannot change anything a test could observe, and no test can be written that
would.

`annotation-union` is checked per site rather than taken on trust, because the obvious phrasing of
this rule is false. `quote_authority.py`'s `ExecutionQuoteAuditV1` builds a runtime type alias — `Annotated[A | B,
Field(...)]` — whose `|` *is* evaluated at import, and the batch kills its mutants while every
annotation `|` survives. Excluding the operator family by name, which is what an earlier draft of
`mutation.toml` did, would have thrown away 11 mutants the tests genuinely catch. The classifier
therefore parses the module and accepts the mutation only on a line where no `|` is evaluated.
"""

# ---------------------------------------------------------------------------------------------
# Sites: one entry per mutation site, written by hand.
# ---------------------------------------------------------------------------------------------
# @dataclass(frozen=True, slots=False)
[[accepted]]
module = "tracefold/trading/market_context.py"
function = "<module>"
line = 38
operator = "core/ReplaceTrueWithFalse"
occurrence = 1
reason = """
`slots=True` becomes `slots=False`. That changes how instances are laid out in memory and nothing
else: the class is still `frozen=True`, so attribute assignment still raises, and no test can
observe the difference. The immutability half of the same decorator *is* covered — mutating a
frozen instance is asserted directly — which is why only the `slots` mutant survives here.
"""

# def select_bar(bars: Sequence[Bar], /, target_ms: int, gap_tolerance_ms: int) -> Bar | None:
[[accepted]]
module = "tracefold/trading/market_context.py"
function = "select_bar"
line = 55
operator = "core/ReplaceBinaryOperator_Mul_Div"
occurrence = 0
reason = """
Cosmic Ray reads the bare `*` that opens a keyword-only section as a multiplication operator and
rewrites it to `/`, which is the positional-only marker. The parameters after it become
positional-or-keyword rather than keyword-only, so every existing call — all of which pass them by
keyword — binds exactly as before. Killing this would mean asserting that a keyword-only parameter
cannot be passed positionally, which is a fact about Python rather than about this function.
"""

# if best is None or int(target_ms) % best.close_at_ms > int(gap_tolerance_ms):
[[accepted]]
module = "tracefold/trading/market_context.py"
function = "select_bar"
line = 67
operator = "core/ReplaceBinaryOperator_Sub_Mod"
occurrence = 0
reason = """
`a - b` becomes `a % b`, on a pair of epoch timestamps where `b` is within a small window of `a`.
For non-negative integers with `b > a / 2`, `a % b` is exactly `a - b`, so the two are the same
expression over every input this line can receive. Reaching a case where they differ needs a
subtrahend below half the minuend — a bar or quote timestamped before roughly 1985 — which the
staleness and gap-tolerance bounds reject before the arithmetic is used for anything.
"""

