# outcome.submission_fence_version is not "submission_fence_v1"
[[accepted]]
module = "tracefold/trading/quote_authority.py"
function = "from_outcome"
line = 161
operator = "core/ReplaceComparisonOperator_NotEq_IsNot"
occurrence = 0
reason = """
`!=` becomes `is not` on a comparison against a string literal, and every fixture supplies that
literal, so identity and equality agree and no test here distinguishes them.

This one is listed rather than dismissed, because it is not equivalent. The compared value reaches
this line from PostgreSQL — a submission-fence version and a stage recorded on a Case — and a string
decoded from a database row is not the interned constant, so `is not` would be true for a value that
is equal and the fence would be refused in production while every test stayed green. The code
correctly uses `!=`; what the entry records is that the tests cannot reach the difference. Killing
it needs a fixture whose string is built at runtime rather than written as a literal, which is worth
doing when this module next gets attention and is more than a mutation-score line item.
"""

# or q1.stage > "Q1"
[[accepted]]
module = "tracefold/trading/quote_authority.py"
function = "from_outcome"
line = 166
operator = "core/ReplaceComparisonOperator_NotEq_Gt"
occurrence = 1
reason = """
An equality against a string literal becomes an ordering. The compared value is a `Literal` with
two members, and over that domain the ordering agrees with equality at both points, so the mutant
computes the same answer for every value the type permits. Only widening the `Literal` would make
this observable, and that change would fail the type check first.
"""

