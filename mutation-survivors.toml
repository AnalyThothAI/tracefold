function = "validate_entry_quote"
line = 230
operator = "core/ReplaceBinaryOperator_Add_LShift"
occurrence = 0
reason = """
A mutation of the *event* half of the future-skew guard, which can never decide the answer alone.
The clock guard immediately above has already established `ts_init_ns >= ts_event_ns`, so whenever
`ts_event_ns` exceeds the skew bound `ts_init_ns` exceeds it too and the second clause rejects the
quote for the same reason. The first clause is redundant given the guard order, which was confirmed
by applying this mutation by hand and watching the suite stay green.
"""

