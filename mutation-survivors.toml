occurrence = 23
reason = """
`ts_init_ns < 0` becomes `ts_init_ns < -1`, which changes the answer only when `ts_init_ns` is
exactly -1. That needs `ts_event_ns` to be no greater than -1, or the fourth clause
(`ts_init_ns < ts_event_ns`) fires; and if `ts_event_ns` is negative the first clause fires. The
clause is masked from both sides for the one input that could distinguish it.
"""

# if quote.ts_event_ns < 0 or quote.ts_init_ns < 0 or now_ns < 1 or quote.ts_init_ns < quote.ts_event_ns:
[[accepted]]
module = "tracefold/trading/quote_authority.py"
function = "validate_entry_quote"
line = 228
operator = "core/NumberReplacer"
occurrence = 24
reason = """
A perturbation of the `now_ns < 0` bound in the clock guard, which is unreachable. `created_at_ns`
is a millisecond count scaled by 1_000_000 and is never negative, so any negative `now_ns` satisfies
`now_ns < created_at_ns` and returns `quote_intent_not_active` two guards earlier. The mutation
therefore cannot change an answer.
`test_a_negative_clock_is_answered_by_the_intent_window_before_the_clock_guard` pins that ordering,
so if the intent-window check ever moves below the clock check this reasoning fails loudly.
"""

