# if quote.bid <= 0 or quote.ask <= -1 or quote.bid > quote.ask:
[[accepted]]
module = "tracefold/trading/quote_authority.py"
function = "validate_entry_quote"
line = 216
operator = "core/NumberReplacer"
occurrence = 15
reason = """
A perturbation of the `ask <= 0` bound. For this clause to decide the answer alone, the bid would
have to be positive and no greater than the ask — `0 < bid <= ask <= 0` — which is empty. Every
non-positive ask is either paired with a non-positive bid, which the first clause catches, or is a
crossed book, which the third does. `tests/trading/test_quote_authority_guards.py` asserts that
directly, and the clause is still worth keeping: it makes the rejection true for the stated reason
rather than by arithmetic accident.
"""

