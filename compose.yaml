name: tracefold

services:
  rsshub:
    image: diygod/rsshub:5527d18de9605e5df9112f40904596e6ae5b971e@sha256:5730db6dead9c8e6610c92fc71900fa2e7735346d80d6be79ead3f2419d88282
    restart: unless-stopped
    env_file:
      - path: ${HOME}/.tracefold/rsshub.env
        required: false
    environment:
      NODE_ENV: production
      CACHE_TYPE: memory
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:1200/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:18-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
    restart: unless-stopped
    shm_size: 256mb
    command:
      [
        "postgres",
        "-c",
        "shared_preload_libraries=pg_stat_statements",
        "-c",
        "compute_query_id=on",
        "-c",
        "pg_stat_statements.max=20000",
        "-c",
        "pg_stat_statements.track=all",
        "-c",
        "pg_stat_statements.track_planning=off",
        "-c",
        "track_io_timing=on",
        "-c",
        "track_wal_io_timing=on",
        "-c",
        "track_activity_query_size=4096",
        "-c",
        "max_connections=100",
      ]
    environment:
      POSTGRES_DB: tracefold
      POSTGRES_USER: tracefold_app
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --data-checksums"
    secrets:
      - postgres_password
    ports:
      - "${TRACEFOLD_POSTGRES_HOST:-127.0.0.1}:${TRACEFOLD_POSTGRES_PORT:-56532}:5432"
    volumes:
      - tracefold-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracefold_app -d tracefold"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "5.0"

  migrate:
    build:
      context: .
      secrets:
        - github_token
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${HOME}/.tracefold/config.yaml:/root/.tracefold/config.yaml:ro
      - ${HOME}/.tracefold/postgres_migrate_password:/root/.tracefold/postgres_migrate_password:ro
      - ${HOME}/.tracefold/logs:/root/.tracefold/logs
    command: ["tracefold", "db", "migrate"]

  cutover:
    profiles: ["maintenance"]
    build:
      context: .
      secrets:
        - github_token
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - postgres_password
    volumes:
      - ${HOME}/.tracefold/config.yaml:/root/.tracefold/config.yaml:ro
      - ${HOME}/.tracefold/postgres_serve_password:/root/.tracefold/postgres_serve_password:ro
      - ${HOME}/.tracefold/postgres_workers_password:/root/.tracefold/postgres_workers_password:ro
      - ${HOME}/.tracefold/postgres_migrate_password:/root/.tracefold/postgres_migrate_password:ro
      - ${HOME}/.tracefold/cache:/root/.tracefold/cache
      - ${HOME}/.tracefold/logs:/root/.tracefold/logs
    command: ["tracefold", "db", "hard-cut"]

  serve:
    build:
      context: .
      secrets:
        - github_token
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8765:8765"
    volumes:
      - ${HOME}/.tracefold/config.yaml:/root/.tracefold/config.yaml:ro
      - ${HOME}/.tracefold/postgres_serve_password:/root/.tracefold/postgres_serve_password:ro
      - ${HOME}/.tracefold/cache:/root/.tracefold/cache:ro
      - ${HOME}/.tracefold/logs:/root/.tracefold/logs
    command: ["tracefold", "serve"]
    stop_grace_period: 35s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8765/healthz', timeout=1).read()",
        ]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 20s

  workers:
    build:
      context: .
      secrets:
        - github_token
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      FINANCE_FRED_API_KEY: ${FINANCE_FRED_API_KEY:-}
    volumes:
      - ${HOME}/.tracefold/config.yaml:/root/.tracefold/config.yaml:ro
      - ${HOME}/.tracefold/postgres_workers_password:/root/.tracefold/postgres_workers_password:ro
      - ${HOME}/.tracefold/cache:/root/.tracefold/cache
      - ${HOME}/.tracefold/logs:/root/.tracefold/logs
    command: ["tracefold", "workers"]
    stop_grace_period: 35s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8766/readyz', timeout=1).read()",
        ]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 20s

volumes:
  tracefold-postgres:

secrets:
  postgres_password:
    file: ${HOME}/.tracefold/postgres_password
  github_token:
    environment: GITHUB_TOKEN
