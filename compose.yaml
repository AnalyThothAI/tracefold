name: tracefold

x-tracefold-app: &tracefold-app
  image: ${COMPOSE_PROJECT_NAME:-tracefold}-app:local
  build:
    context: .
    args:
      TRACEFOLD_BUILD_REVISION: ${TRACEFOLD_BUILD_REVISION:-}
    secrets:
      - github_token
  # The image cannot hash itself at build time, so the digest arrives at start time.
  # `make up` computes it from the image it just built; an empty value is read back
  # as "unversioned" rather than as an identity the receipt cannot prove.
  environment:
    TRACEFOLD_IMAGE_DIGEST: ${TRACEFOLD_IMAGE_DIGEST:-}

services:
  postgres:
    image: postgres:18-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
    restart: unless-stopped
    shm_size: 256mb
    command:
      [
        "postgres",
        "-c",
        "shared_preload_libraries=pg_stat_statements",
        "-c",
        "compute_query_id=on",
        "-c",
        "pg_stat_statements.max=20000",
        "-c",
        "pg_stat_statements.track=all",
        "-c",
        "pg_stat_statements.track_planning=off",
        "-c",
        "track_io_timing=on",
        "-c",
        "track_wal_io_timing=on",
        "-c",
        "track_activity_query_size=4096",
        "-c",
        "max_connections=100",
      ]
    environment:
      POSTGRES_DB: tracefold
      POSTGRES_USER: tracefold_app
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --data-checksums"
    secrets:
      - postgres_password
      - postgres_serve_password
      - postgres_workers_password
      - postgres_migrate_password
    ports:
      - "${TRACEFOLD_POSTGRES_HOST:-127.0.0.1}:${TRACEFOLD_POSTGRES_PORT:-56532}:5432"
    volumes:
      - tracefold-postgres:/var/lib/postgresql
      - ./docker/postgres-init-runtime-roles.sh:/docker-entrypoint-initdb.d/10-tracefold-runtime-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracefold_workers -d tracefold"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "5.0"

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    hostname: tracefold-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${TRACEFOLD_RABBITMQ_USER:-tracefold}
      RABBITMQ_DEFAULT_PASS: ${TRACEFOLD_RABBITMQ_PASSWORD:-tracefold}
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "${TRACEFOLD_RABBITMQ_HOST:-127.0.0.1}:${TRACEFOLD_RABBITMQ_PORT:-5672}:5672"
      - "${TRACEFOLD_RABBITMQ_MGMT_HOST:-127.0.0.1}:${TRACEFOLD_RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - tracefold-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  migrate:
    <<: *tracefold-app
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${HOME}/.tracefold/config.yaml:/root/.tracefold/config.yaml:ro
      - ${HOME}/.tracefold/postgres_migrate_password:/root/.tracefold/postgres_migrate_password:ro
      - ${HOME}/.tracefold/logs:/root/.tracefold/logs
    command: ["tracefold", "db", "migrate"]

  serve:
    <<: *tracefold-app
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${TRACEFOLD_API_HOST:-127.0.0.1}:${TRACEFOLD_API_PORT:-8765}:8765"
    volumes:
      - ${HOME}/.tracefold/config.yaml:/root/.tracefold/config.yaml:ro
      - ${HOME}/.tracefold/postgres_serve_password:/root/.tracefold/postgres_serve_password:ro
      - ${HOME}/.tracefold/cache:/root/.tracefold/cache:ro
      - ${HOME}/.tracefold/logs:/root/.tracefold/logs
    command: ["tracefold", "serve"]
    stop_grace_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8765/healthz', timeout=1).read()",
        ]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 20s

  workers:
    <<: *tracefold-app
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${TRACEFOLD_WORKERS_HOST:-127.0.0.1}:${TRACEFOLD_WORKERS_PORT:-8766}:8766"
    volumes:
      - ${HOME}/.tracefold/config.yaml:/root/.tracefold/config.yaml:ro
      - ${HOME}/.tracefold/postgres_workers_password:/root/.tracefold/postgres_workers_password:ro
      - ${HOME}/.tracefold/cache:/root/.tracefold/cache
      - ${HOME}/.tracefold/logs:/root/.tracefold/logs
    command: ["tracefold", "workers"]
    stop_grace_period: 40s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8766/readyz', timeout=1).read()",
        ]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 20s

volumes:
  tracefold-postgres:
  tracefold-rabbitmq:

secrets:
  postgres_password:
    file: ${HOME}/.tracefold/postgres_password
  postgres_serve_password:
    file: ${HOME}/.tracefold/postgres_serve_password
  postgres_workers_password:
    file: ${HOME}/.tracefold/postgres_workers_password
  postgres_migrate_password:
    file: ${HOME}/.tracefold/postgres_migrate_password
  github_token:
    environment: GITHUB_TOKEN
