name: tracefold

x-tracefold-app: &tracefold-app
  image: ${TRACEFOLD_APP_IMAGE:-${COMPOSE_PROJECT_NAME:-tracefold}-app:local}
  build:
    context: .
    args:
      TRACEFOLD_BUILD_REVISION: ${TRACEFOLD_BUILD_REVISION:-}
    secrets:
      - github_token
  # The image cannot hash itself at build time, so the digest arrives at start time.
  # `make up` computes it from the image it just built; an empty value is read back
  # as "unversioned" rather than as an identity the receipt cannot prove.
  environment:
    TRACEFOLD_IMAGE_DIGEST: ${TRACEFOLD_IMAGE_DIGEST:-}

services:
  postgres:
    image: postgres:18-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
    restart: unless-stopped
    shm_size: 256mb
    command:
      [
        "postgres",
        "-c",
        "shared_preload_libraries=pg_stat_statements",
        "-c",
        "compute_query_id=on",
        "-c",
        "pg_stat_statements.max=20000",
        "-c",
        "pg_stat_statements.track=all",
        "-c",
        "pg_stat_statements.track_planning=off",
        "-c",
        "track_io_timing=on",
        "-c",
        "track_wal_io_timing=on",
        "-c",
        "track_activity_query_size=4096",
        "-c",
        "max_connections=100",
      ]
    environment:
      POSTGRES_DB: tracefold
      POSTGRES_USER: tracefold_app
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --data-checksums"
    secrets:
      - postgres_password
      - postgres_database_password
    ports:
      - "${TRACEFOLD_POSTGRES_HOST:-127.0.0.1}:${TRACEFOLD_POSTGRES_PORT:-56532}:5432"
    volumes:
      - tracefold-postgres:/var/lib/postgresql
      - ./docker/postgres-init-single-login.sh:/docker-entrypoint-initdb.d/10-tracefold-single-login.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracefold -d tracefold"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "5.0"

  rabbitmq:
    # 4.3 is a hard requirement, not a preference: quorum delayed retry, broker-owned delivery counting
    # and at-least-once dead lettering are what replaced Tracefold's own retry lane (#400).
    image: rabbitmq:4.3.5-management@sha256:45226f38499559b9f56875c752cc6689ff90e8f20796fe80fd9bc28d64723031
    restart: unless-stopped
    hostname: tracefold-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${TRACEFOLD_RABBITMQ_USER:-tracefold}
      RABBITMQ_DEFAULT_PASS: ${TRACEFOLD_RABBITMQ_PASSWORD:-tracefold}
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "${TRACEFOLD_RABBITMQ_HOST:-127.0.0.1}:${TRACEFOLD_RABBITMQ_PORT:-5672}:5672"
      - "${TRACEFOLD_RABBITMQ_MGMT_HOST:-127.0.0.1}:${TRACEFOLD_RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - tracefold-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      # As the `rabbitmq` user, never as root. The server runs as `rabbitmq`, and a root-run CLI that
      # reaches /var/lib/rabbitmq before the node has written .erlang.cookie creates that file owned by
      # root with mode 0400 — after which the server cannot read its own cookie and 4.3.5 refuses to
      # boot. Reproduced on 4.3.5 with a fresh volume; it only stays hidden on a volume that already
      # carries a correctly owned cookie.
      # PATH is spelled out because `su` resets it on the Debian image (but not on the Alpine one CI
      # uses), which would leave the probe unable to find the CLI it just dropped privileges to run.
      test:
        [
          "CMD",
          "su",
          "-s",
          "/bin/sh",
          "rabbitmq",
          "-c",
          "PATH=/opt/rabbitmq/sbin:/opt/erlang/bin:/usr/local/bin:/usr/bin:/bin rabbitmq-diagnostics -q check_port_connectivity",
        ]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  # The News retry contract is a RabbitMQ policy, imported from the version-controlled definitions
  # document before any consumer attaches. It is a one-shot declarative import with no state machine of
  # its own; Workers verifies the effective policy and refuses to consume if it does not match.
  rabbitmq-policy:
    <<: *tracefold-app
    restart: "no"
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ${HOME}/.tracefold/config.yaml:/root/.tracefold/config.yaml:ro
      - ${HOME}/.tracefold/logs:/root/.tracefold/logs
    command: ["tracefold", "news", "bus-policy", "apply"]

  migrate:
    <<: *tracefold-app
    restart: "no"
    environment:
      TRACEFOLD_IMAGE_DIGEST: ${TRACEFOLD_IMAGE_DIGEST:-}
      TRACEFOLD_NEWS_GENESIS_PREFLIGHT_JSON: ${TRACEFOLD_NEWS_GENESIS_PREFLIGHT_JSON:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq-policy:
        condition: service_completed_successfully
    volumes:
      - ${HOME}/.tracefold/config.yaml:/root/.tracefold/config.yaml:ro
      - ${HOME}/.tracefold/postgres_database_password:/root/.tracefold/postgres_database_password:ro
      - ${HOME}/.tracefold/logs:/root/.tracefold/logs
    command: ["tracefold", "db", "migrate"]

  serve:
    <<: *tracefold-app
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${TRACEFOLD_API_HOST:-127.0.0.1}:${TRACEFOLD_API_PORT:-8765}:8765"
    volumes:
      - ${HOME}/.tracefold/config.yaml:/root/.tracefold/config.yaml:ro
      - ${HOME}/.tracefold/postgres_database_password:/root/.tracefold/postgres_database_password:ro
      - ${HOME}/.tracefold/cache:/root/.tracefold/cache:ro
      - ${HOME}/.tracefold/logs:/root/.tracefold/logs
    command: ["tracefold", "serve"]
    stop_grace_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8765/healthz', timeout=1).read()",
        ]
      interval: 10s
      # Liveness only, so the start period stays short. The timeout covers spawning the interpreter the
      # probe runs in, which is what exceeded 2 s under load on 2026-08-31.
      timeout: 5s
      retries: 3
      start_period: 20s

  workers:
    <<: *tracefold-app
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rabbitmq-policy:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    ports:
      - "${TRACEFOLD_WORKERS_HOST:-127.0.0.1}:${TRACEFOLD_WORKERS_PORT:-8766}:8766"
    volumes:
      - ${HOME}/.tracefold/config.yaml:/root/.tracefold/config.yaml:ro
      - ${HOME}/.tracefold/postgres_database_password:/root/.tracefold/postgres_database_password:ro
      - ${HOME}/.tracefold/telegram_bot_token:/root/.tracefold/telegram_bot_token:ro
      - ${HOME}/.tracefold/binance_usdm_api_key:/root/.tracefold/binance_usdm_api_key:ro
      - ${HOME}/.tracefold/binance_usdm_api_secret:/root/.tracefold/binance_usdm_api_secret:ro
      - ${HOME}/.tracefold/hyperliquid_private_key:/root/.tracefold/hyperliquid_private_key:ro
      - ${HOME}/.tracefold/cache:/root/.tracefold/cache
      - ${HOME}/.tracefold/logs:/root/.tracefold/logs
    command: ["tracefold", "workers"]
    stop_grace_period: 40s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    healthcheck:
      # Readiness, not liveness: `make up` waits on this, and a deploy is not finished until Workers is
      # actually consuming. That makes the whole startup path part of the budget — wiring every Program,
      # registering the runtime manifest, and verifying the broker's effective policy, which alone may
      # wait out RabbitMQ's statistics interval (`POLICY_EFFECTIVE_TIMEOUT_SECONDS`, 30 s) on a broker
      # that has just declared its queues. The old 20 s start period was shorter than that single
      # documented wait, so a cold image start could be reported unhealthy while it was still correctly
      # starting: observed on 2026-08-31, where `docker compose up --wait` failed a deploy whose Workers
      # then went healthy moments later. 90 s + 5 x 10 s is roughly three times the old budget and still
      # well inside the Compose wait timeout, so a genuinely stuck start is still caught.
      # `timeout` is 5 s because the probe spawns a Python interpreter before it makes the request; a
      # 2 s budget for that timed out under load in the same incident.
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8766/readyz', timeout=1).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s

  nautilus:
    <<: *tracefold-app
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${TRACEFOLD_NAUTILUS_HOST:-127.0.0.1}:${TRACEFOLD_NAUTILUS_PORT:-8767}:8767"
    volumes:
      - ${HOME}/.tracefold/config.yaml:/root/.tracefold/config.yaml:ro
      - ${HOME}/.tracefold/postgres_database_password:/root/.tracefold/postgres_database_password:ro
      - ${HOME}/.tracefold/binance_usdm_api_key:/root/.tracefold/binance_usdm_api_key:ro
      - ${HOME}/.tracefold/binance_usdm_api_secret:/root/.tracefold/binance_usdm_api_secret:ro
      - ${HOME}/.tracefold/logs:/root/.tracefold/logs
    command: ["tracefold", "nautilus", "run"]
    stop_grace_period: 40s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8767/readyz', timeout=1).read()",
        ]
      interval: 10s
      # Same interpreter-spawn cost as the other two probes.
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  tracefold-postgres:
  tracefold-rabbitmq:

secrets:
  postgres_password:
    file: ${HOME}/.tracefold/postgres_password
  postgres_database_password:
    file: ${HOME}/.tracefold/postgres_database_password
  github_token:
    environment: GITHUB_TOKEN
