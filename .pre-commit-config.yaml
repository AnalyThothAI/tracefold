# .pre-commit-config.yaml
# Hooks run on every commit. They are gate-1 only; `make check` is the canonical
# hermetic static/drift entry and release evidence additionally uses `make test-all`.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: eslint-web
        name: eslint (web/src)
        entry: bash -c 'cd web && npm run lint'
        language: system
        types_or: [ts, tsx]
        files: ^web/src/.*\.(ts|tsx)$
        pass_filenames: false

      - id: prettier-web
        name: prettier (web/src)
        entry: bash -c 'cd web && npm run format:check'
        language: system
        types_or: [ts, tsx, css, json]
        files: ^web/.*\.(ts|tsx|css|json)$
        pass_filenames: false
